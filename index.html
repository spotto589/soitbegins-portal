<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>:: signal assessment ::</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #08080a;
    --green: #39ff14;
    --magenta: #ff003c;
    --fs: clamp(13px, 2vw, 19px);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }

  body{
    font-family:'JetBrains Mono', 'Courier New', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  canvas#static{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    opacity:0.32;
    filter:brightness(0.7) contrast(1.3);
    mix-blend-mode:screen;
    transition:opacity 0.08s linear, filter 0.08s linear;
  }
  canvas#static.burst{
    opacity:0.65;
    filter:brightness(1) contrast(1.5);
  }

  .static-wash{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(8,8,10,0.35), rgba(8,8,10,0.6));
  }

  .scanlines{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    animation:scan-drift 6s linear infinite;
  }
  @keyframes scan-drift{
    0%{ background-position:0 0; }
    100%{ background-position:0 100px; }
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.88) 100%);
    pointer-events:none;
    z-index:6;
  }

  .fuzzy-field{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;
    overflow:hidden;
  }

  .fz{
    position:absolute;
    color:var(--green);
    text-shadow:0 0 8px rgba(57,255,20,0.35);
    white-space:nowrap;
    font-weight:700;
  }
  .fz--sm{ font-size:clamp(13px,1.6vw,18px); opacity:0.55; }

  .blk{
    display:inline-block;
    width:0.55em;
    height:0.55em;
    background:#e8e8e8;
    margin-left:0.45em;
    vertical-align:-0.05em;
    opacity:0.8;
    animation:blk-blink 1.4s step-end infinite;
  }

  @keyframes blk-blink{
    0%, 50%{ opacity:0.8; }
    51%, 100%{ opacity:0.1; }
  }

  .eyebrow{
    position:relative;
    z-index:10;
    font-size:var(--fs);
    letter-spacing:0.35em;
    color:var(--green);
    text-transform:uppercase;
    text-shadow:0 0 6px rgba(57,255,20,0.5);
    min-height:1.4em;
  }

  .eyebrow.err-flash{
    animation:err-flash 0.4s steps(1) 4;
  }
  @keyframes err-flash{
    0%, 100%{ opacity:0.9; color:var(--green); text-shadow:0 0 6px rgba(57,255,20,0.5); }
    50%{ opacity:1; color:var(--magenta); text-shadow:0 0 10px rgba(255,0,60,0.8); }
  }

  .eyebrow .cursor{
    display:inline-block;
    width:7px;
    height:0.95em;
    background:var(--green);
    vertical-align:-1px;
    margin-left:2px;
    animation:blink 0.6s step-end infinite;
  }

  @keyframes blink{
    0%, 50%{ opacity:1; }
    51%, 100%{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .scanlines, .eyebrow .cursor, .eyebrow.err-flash, .blk{
      animation:none !important;
    }
  }
</style>
</head>
<body>

  <canvas id="static"></canvas>
  <div class="static-wash"></div>
  <div class="scanlines"></div>

  <div class="fuzzy-field" aria-hidden="true">
    <div class="fz fz--sm" style="top:4%; left:3%;"><span class="fz-text" data-final="Fuzzy.">Fuzzy.</span><span class="blk"></span></div>
  </div>

  <div class="eyebrow" id="eyebrow"><span id="eyebrowText"></span><span class="cursor"></span></div>

<script>
  const canvas = document.getElementById('static');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = window.innerWidth / 3;
    canvas.height = window.innerHeight / 3;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawStatic(){
    const w = canvas.width, h = canvas.height;
    const imageData = ctx.createImageData(w, h);
    const buffer = imageData.data;
    for(let i=0; i<buffer.length; i+=4){
      const shade = Math.random() * 255;
      buffer[i] = shade;
      buffer[i+1] = shade;
      buffer[i+2] = shade;
      buffer[i+3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  }
  function staticLoop(){
    drawStatic();
    requestAnimationFrame(staticLoop);
  }
  staticLoop();

  function staticBurst(){
    canvas.classList.add('burst');
    setTimeout(()=> canvas.classList.remove('burst'), 220 + Math.random()*180);
    setTimeout(staticBurst, 2200 + Math.random() * 3000);
  }
  setTimeout(staticBurst, 1500);

  const eyebrowFull = "ERR://STAT!C_BRΞ4CH";
  const eyebrowEl = document.getElementById('eyebrowText');
  const eyebrowWrap = document.getElementById('eyebrow');

  function typeOnce(){
    let i = 0;
    eyebrowEl.textContent = "";
    const typeInterval = setInterval(()=>{
      eyebrowEl.textContent = eyebrowFull.slice(0, i+1);
      i++;
      if(i >= eyebrowFull.length){
        clearInterval(typeInterval);
        eyebrowWrap.classList.add('err-flash');
        setTimeout(()=> eyebrowWrap.classList.remove('err-flash'), 1600);
        scheduleReflash();
      }
    }, 65);
  }

  function scheduleReflash(){
    setTimeout(()=>{
      eyebrowWrap.classList.add('err-flash');
      setTimeout(()=> eyebrowWrap.classList.remove('err-flash'), 1600);
      scheduleReflash();
    }, 4000 + Math.random() * 5000);
  }

  typeOnce();

  // Matrix-style scramble/decode effect for the background "Fuzzy." / "Details are ..." field
  const GLYPHS = "!<>-_\\/[]{}=+*^?#01ΑΒΓΔΞΣΦΨΩαβγδθλμξπ";

  function scrambleReveal(el, finalText, duration){
    const chars = finalText.split('');
    const totalFrames = Math.round(duration / 45);
    let frame = 0;
    function tick(){
      let out = '';
      for(let i = 0; i < chars.length; i++){
        const c = chars[i];
        if(c === ' '){ out += ' '; continue; }
        const revealFrame = (i / chars.length) * totalFrames * 0.7;
        if(frame >= revealFrame){
          out += c;
        } else {
          out += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        }
      }
      el.textContent = out;
      frame++;
      if(frame <= totalFrames){
        setTimeout(tick, 45);
      } else {
        el.textContent = finalText;
      }
    }
    tick();
  }

  document.querySelectorAll('.fz-text').forEach(el => {
    const finalText = el.dataset.final;
    function loop(){
      scrambleReveal(el, finalText, 500 + Math.random() * 400);
      setTimeout(loop, 3000 + Math.random() * 4000);
    }
    setTimeout(loop, Math.random() * 3000);
  });
</script>

</body>
</html>
