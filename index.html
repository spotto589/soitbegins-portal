<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>:: signal assessment ::</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #08080a;
    --fg: #e8e8e8;
    --cyan: #00fff2;
    --magenta: #ff003c;
    --green: #39ff14;
    --fs: clamp(13px, 2vw, 19px);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background:var(--bg);
    overflow:hidden;
    cursor:default;
  }

  body{
    font-family:'JetBrains Mono', 'Courier New', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* TV static */
  canvas#static{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    opacity:0.32;
    filter:brightness(0.7) contrast(1.3);
    mix-blend-mode:screen;
    transition:opacity 0.08s linear, filter 0.08s linear;
  }
  canvas#static.burst{
    opacity:0.65;
    filter:brightness(1) contrast(1.5);
  }

  .static-wash{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(8,8,10,0.35), rgba(8,8,10,0.6));
  }

  /* horizontal tear bars, spawned by JS */
  .tear{
    position:fixed;
    left:0;
    width:100%;
    z-index:3;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0.8;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.88) 100%);
    pointer-events:none;
    z-index:5;
  }

  /* emergency broadcast style full-screen glitch, fired on an interval */
  .ebs-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    opacity:0;
  }
  .ebs-overlay.hit{
    animation:ebs-sequence 0.5s steps(1) forwards;
  }
  .ebs-bars{
    position:absolute;
    inset:0;
    width:140%;
    left:-20%;
    background:linear-gradient(90deg,
      #ffb000 0 14.2%, #00fff2 14.2% 28.4%, #ff003c 28.4% 42.6%,
      #39ff14 42.6% 56.8%, #ffffff 56.8% 71%, #a200ff 71% 85.2%, #ffb000 85.2% 100%);
    mix-blend-mode:normal;
  }
  .ebs-overlay.hit .ebs-bars{
    animation:ebs-swish 0.5s ease-in-out forwards;
  }
  @keyframes ebs-swish{
    0%{ transform:translateX(-15%) scaleY(1); }
    30%{ transform:translateX(6%) scaleY(1.02); }
    55%{ transform:translateX(-4%) scaleY(0.98); }
    75%{ transform:translateX(3%) scaleY(1.01); }
    100%{ transform:translateX(0%) scaleY(1); }
  }
  @keyframes ebs-sequence{
    0%{ opacity:0; }
    6%{ opacity:0.95; }
    14%{ opacity:0; }
    20%{ opacity:0.9; }
    26%{ opacity:0.05; }
    34%{ opacity:0.95; }
    40%{ opacity:0; }
    50%{ opacity:0.85; }
    58%{ opacity:0.05; }
    68%{ opacity:0.75; }
    78%{ opacity:0; }
    88%{ opacity:0.4; }
    100%{ opacity:0; }
  }

  .scanlines{
    position:fixed;
    inset:0;
    z-index:6;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    animation:scan-drift 6s linear infinite;
  }
  @keyframes scan-drift{
    0%{ background-position:0 0; }
    100%{ background-position:0 100px; }
  }

  .stage{
    position:relative;
    z-index:10;
    text-align:center;
    padding:2rem;
    max-width:90vw;
  }

  .eyebrow{
    font-size:var(--fs);
    letter-spacing:0.35em;
    color:var(--green);
    text-transform:uppercase;
    margin-bottom:1.25rem;
    opacity:0.9;
    text-shadow:0 0 6px rgba(57,255,20,0.5);
    min-height:1.4em;
  }

  .eyebrow.err-flash{
    animation:err-flash 0.4s steps(1) 4;
  }
  @keyframes err-flash{
    0%, 100%{ opacity:0.9; color:var(--green); text-shadow:0 0 6px rgba(57,255,20,0.5); }
    50%{ opacity:1; color:var(--magenta); text-shadow:0 0 10px rgba(255,0,60,0.8); }
  }

  .eyebrow .cursor{
    display:inline-block;
    width:7px;
    height:0.95em;
    background:var(--green);
    vertical-align:-1px;
    margin-left:2px;
    animation:blink 0.6s step-end infinite;
  }

  .msg{
    position:relative;
    display:inline-block;
    font-size:var(--fs);
    font-weight:700;
    letter-spacing:0.1em;
    line-height:1.15;
    color:var(--fg);
    text-shadow:0 0 8px rgba(232,232,232,0.15);
    text-transform:uppercase;
  }

  .msg .glitch-word{
    position:relative;
    display:inline-block;
    animation:word-shake 2.6s infinite;
  }

  .glitch-word::before,
  .glitch-word::after{
    content:attr(data-text);
    position:absolute;
    left:0; top:0;
    width:100%;
    overflow:hidden;
  }
  .glitch-word::before{
    color:var(--cyan);
    z-index:-1;
    animation:glitch-cyan 1.9s infinite steps(1);
  }
  .glitch-word::after{
    color:var(--magenta);
    z-index:-2;
    animation:glitch-magenta 1.9s infinite steps(1);
  }

  @keyframes word-shake{
    0%, 100%{ transform:translate(0,0) skew(0deg); }
    2%{ transform:translate(-3px,1px) skew(-1deg); }
    4%{ transform:translate(3px,-2px) skew(1deg); }
    6%{ transform:translate(-2px,0) skew(0deg); }
    8%{ transform:translate(0,0); }
    40%{ transform:translate(2px,1px); }
    42%{ transform:translate(-3px,-1px); }
    44%{ transform:translate(0,0); }
    70%{ transform:translate(-2px,2px) skew(-1deg); }
    72%{ transform:translate(2px,-1px) skew(1deg); }
    74%{ transform:translate(0,0) skew(0deg); }
  }

  @keyframes glitch-cyan{
    0%, 78%, 100%{ transform:translate(0,0); opacity:0; }
    79%{ transform:translate(-4px,2px); opacity:0.9; }
    82%{ transform:translate(3px,-2px); opacity:0.9; }
    85%{ transform:translate(-2px,0); opacity:0.6; }
    88%{ opacity:0; }
  }
  @keyframes glitch-magenta{
    0%, 78%, 100%{ transform:translate(0,0); opacity:0; }
    79%{ transform:translate(4px,-2px); opacity:0.9; }
    82%{ transform:translate(-3px,2px); opacity:0.9; }
    85%{ transform:translate(2px,0); opacity:0.6; }
    88%{ opacity:0; }
  }

  .sub{
    margin-top:1.5rem;
    font-size:var(--fs);
    color:rgba(232,232,232,0.55);
    letter-spacing:0.05em;
  }

  .sub .cursor{
    display:inline-block;
    width:8px;
    height:1em;
    background:var(--green);
    vertical-align:-2px;
    margin-left:4px;
    animation:blink 1s step-end infinite;
  }

  @keyframes blink{
    0%, 50%{ opacity:1; }
    51%, 100%{ opacity:0; }
  }

  .enter-btn{
    margin-top:2rem;
    display:inline-block;
    background:transparent;
    border:1px solid rgba(57,255,20,0.6);
    color:var(--green);
    font-family:inherit;
    font-size:var(--fs);
    letter-spacing:0.12em;
    padding:0.9em 1.6em;
    cursor:pointer;
    text-transform:uppercase;
    text-shadow:0 0 6px rgba(57,255,20,0.6);
    transition:background 0.15s ease;
  }
  .enter-btn:hover{
    background:rgba(57,255,20,0.12);
  }
  .enter-btn:focus-visible{
    outline:2px solid var(--green);
    outline-offset:3px;
  }

  .access-status{
    margin-top:1.25rem;
    font-size:var(--fs);
    letter-spacing:0.08em;
    min-height:1.4em;
    text-transform:uppercase;
  }
  .access-status.checking{
    color:var(--cyan);
    text-shadow:0 0 6px rgba(0,255,242,0.5);
  }
  .access-status.granted{
    color:var(--green);
    text-shadow:0 0 8px rgba(57,255,20,0.7);
  }
  .access-status.denied{
    color:var(--magenta);
    text-shadow:0 0 8px rgba(255,0,60,0.7);
    animation:err-flash 0.4s steps(1) 4;
  }

  .enter-btn:disabled{
    opacity:0.5;
    cursor:default;
  }
  .enter-btn:disabled:hover{
    background:transparent;
  }

  .stage.jump{
    animation:jump-cut 0.15s steps(1);
  }
  @keyframes jump-cut{
    0%{ transform:translate(0,0); filter:none; }
    20%{ transform:translate(-8px,3px); filter:hue-rotate(20deg); }
    40%{ transform:translate(7px,-4px); filter:hue-rotate(-15deg); }
    60%{ transform:translate(-3px,0); filter:none; }
    100%{ transform:translate(0,0); filter:none; }
  }

  body.blackout .stage,
  body.blackout .scanlines,
  body.blackout canvas#static,
  body.blackout .static-wash{
    opacity:0;
  }
  body.blackout{
    background:#000;
  }

  @media (prefers-reduced-motion: reduce){
    .scanlines, .glitch-word, .glitch-word::before, .glitch-word::after, .sub .cursor, .eyebrow .cursor, .eyebrow.err-flash, .ebs-overlay.hit{
      animation:none !important;
    }
  }
</style>
</head>
<body>

  <canvas id="static"></canvas>
  <div class="static-wash"></div>
  <div class="scanlines"></div>
  <div class="ebs-overlay" id="ebsOverlay">
    <div class="ebs-bars"></div>
  </div>

  <div class="stage" id="stage">
    <div class="eyebrow" id="eyebrow"><span id="eyebrowText"></span><span class="cursor"></span></div>
    <h1 class="msg">STΔTUS: <span class="glitch-word" data-text="GL!TCH!NG">GL!TCH!NG</span></h1>
    <div class="sub">S!GNΔL_ASSESSMΞNT = ΔCT!VΞ :: 🚨 S!RΞN_0NLINE 🚨 :: SYS//UNSTΔBLΞ<span class="cursor"></span></div>
    <button class="enter-btn" id="enterBtn">PRESENT <span style="text-transform:none;">GL!TCH::AccEss_KEy</span> or <span style="text-transform:none;">Σκύλλα</span> CARD TO BEGIN ASSESSMENT...</button>
    <div class="access-status" id="accessStatus"></div>
  </div>

<script src="https://xumm.app/assets/cdn/xumm-oauth2-pkce.min.js"></script>
<script>
  // TV static canvas
  const canvas = document.getElementById('static');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = window.innerWidth / 3;
    canvas.height = window.innerHeight / 3;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawStatic(){
    const w = canvas.width, h = canvas.height;
    const imageData = ctx.createImageData(w, h);
    const buffer = imageData.data;
    for(let i=0; i<buffer.length; i+=4){
      const shade = Math.random() * 255;
      buffer[i] = shade;
      buffer[i+1] = shade;
      buffer[i+2] = shade;
      buffer[i+3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  }
  function staticLoop(){
    drawStatic();
    requestAnimationFrame(staticLoop);
  }
  staticLoop();

  // periodic static "burst" — screen looks like it's glitching harder for a moment
  function staticBurst(){
    canvas.classList.add('burst');
    setTimeout(()=> canvas.classList.remove('burst'), 220 + Math.random()*180);
    setTimeout(staticBurst, 2200 + Math.random() * 3000);
  }
  setTimeout(staticBurst, 1500);

  // horizontal tear bars — brief displaced noise strips, like signal tearing
  function spawnTear(){
    const bar = document.createElement('div');
    bar.className = 'tear';
    const h = 4 + Math.random() * 18;
    bar.style.height = h + 'px';
    bar.style.top = (Math.random() * 100) + 'vh';
    const shades = ['#ffffff', '#bfbfbf', '#e8e8e8', '#8f8f8f'];
    const c1 = shades[Math.floor(Math.random()*shades.length)];
    const c2 = shades[Math.floor(Math.random()*shades.length)];
    bar.style.background = `repeating-linear-gradient(90deg, ${c1} 0px, ${c1} 2px, ${c2} 2px, ${c2} 4px)`;
    bar.style.transform = `translateX(${(Math.random()*40 - 20)}px)`;
    document.body.appendChild(bar);
    setTimeout(()=> bar.remove(), 90 + Math.random()*90);
    scheduleTear();
  }
  function scheduleTear(){
    setTimeout(spawnTear, 300 + Math.random() * 900);
  }
  scheduleTear();

  // jump cuts
  const stage = document.getElementById('stage');
  function jumpCut(){
    stage.classList.add('jump');
    setTimeout(()=> stage.classList.remove('jump'), 180);
    scheduleJump();
  }
  function scheduleJump(){
    setTimeout(jumpCut, 2200 + Math.random() * 4000);
  }
  scheduleJump();

  // blackout blip
  function blackoutBlip(){
    document.body.classList.add('blackout');
    setTimeout(()=> document.body.classList.remove('blackout'), 70);
    setTimeout(blackoutBlip, 6000 + Math.random() * 8000);
  }
  setTimeout(blackoutBlip, 4000);

  // ERR line: type out once, then stay put, with a brief "error flash" flicker
  const eyebrowFull = "ERR://STAT!C_BRΞ4CH";
  const eyebrowEl = document.getElementById('eyebrowText');
  const eyebrowWrap = document.getElementById('eyebrow');

  function typeOnce(){
    let i = 0;
    eyebrowEl.textContent = "";
    const typeInterval = setInterval(()=>{
      eyebrowEl.textContent = eyebrowFull.slice(0, i+1);
      i++;
      if(i >= eyebrowFull.length){
        clearInterval(typeInterval);
        eyebrowWrap.classList.add('err-flash');
        setTimeout(()=> eyebrowWrap.classList.remove('err-flash'), 1600);
        scheduleReflash();
      }
    }, 65);
  }

  // after it's loaded, it stays — but flashes like an unstable error readout every so often
  function scheduleReflash(){
    setTimeout(()=>{
      eyebrowWrap.classList.add('err-flash');
      setTimeout(()=> eyebrowWrap.classList.remove('err-flash'), 1600);
      scheduleReflash();
    }, 4000 + Math.random() * 5000);
  }

  typeOnce();

  // emergency broadcast style glitch, every 13.13 seconds
  const ebsOverlay = document.getElementById('ebsOverlay');
  function triggerEBS(){
    ebsOverlay.classList.remove('hit');
    void ebsOverlay.offsetWidth;
    ebsOverlay.classList.add('hit');
    stage.classList.add('jump');
    setTimeout(()=> stage.classList.remove('jump'), 180);
  }
  setInterval(triggerEBS, 13130);

  // --- Xaman (XUMM) NFT-gated access ---
  const GLITCH_ISSUER = 'rNRo76r8C6c1rMi28AR7CdArtK6r8Zptv7';
  const GLITCH_TAXON = 1;
  const XAMAN_API_KEY = 'c418ff7d-673f-4a7a-b797-3bb0413653f1';

  const enterBtn = document.getElementById('enterBtn');
  const accessStatus = document.getElementById('accessStatus');

  function setStatus(text, state){
    accessStatus.textContent = text;
    accessStatus.className = 'access-status' + (state ? ' ' + state : '');
  }

  async function checkGlitchAccess(account){
    const res = await fetch('https://xrplcluster.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        method: 'account_nfts',
        params: [{ account, limit: 400 }]
      })
    });
    const data = await res.json();
    const nfts = (data.result && data.result.account_nfts) || [];
    return nfts.some(n => n.Issuer === GLITCH_ISSUER && n.NFTokenTaxon === GLITCH_TAXON);
  }

  let xummAuth = null;
  function getAuth(){
    if(!xummAuth){
      xummAuth = new XummPkce(XAMAN_API_KEY, { implicit: true, rememberJwt: false });
      xummAuth.on('error', (err)=>{
        console.error('Xaman auth error', err);
        setStatus('ERR://LOGIN_ABORTED — TRY AGAIN', 'denied');
        enterBtn.disabled = false;
      });
      xummAuth.on('success', async ()=>{
        try{
          const state = await xummAuth.state();
          const account = state && state.me && state.me.account;
          if(!account){
            setStatus('ERR://NO_WALLET_DATA', 'denied');
            enterBtn.disabled = false;
            return;
          }
          setStatus('WALLET LINKED :: SCANNING LEDGER FOR GL!TCH::AccEss_KEy...', 'checking');
          const hasAccess = await checkGlitchAccess(account);
          if(hasAccess){
            setStatus('ΔCCESS GRΔNTED :: GL!TCH KEY VERIFIED', 'granted');
          } else {
            setStatus('ΔCCESS DENIED :: NO GL!TCH KEY DETECTED ON THIS WALLET', 'denied');
          }
        } catch(e){
          console.error(e);
          setStatus('ERR://SIGNAL_LOST — TRY AGAIN', 'denied');
        } finally {
          enterBtn.disabled = false;
        }
      });
    }
    return xummAuth;
  }

  enterBtn.addEventListener('click', ()=>{
    enterBtn.disabled = true;
    setStatus('OPENING SECURE CHANNEL :: SIGN IN WITH XAMAN...', 'checking');
    getAuth().authorize();
  });
</script>

</body>
</html>
