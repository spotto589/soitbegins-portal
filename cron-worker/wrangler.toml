name = "soitbegins-cron"
main = "index.js"
compatibility_date = "2024-09-01"

# Runs independently of site traffic — no visitor request triggers this,
# so the pigeon number/rarity index and the high-sale index stay fresh
# (maybeRefreshPigeonNumberMap / maybeRefreshHighSaleMap in
# ../functions/_shared.js already no-op internally if the data is still
# within its own staleness window, so it's safe/cheap to call on every
# tick — this worker doesn't need its own staleness check on top).
[triggers]
crons = ["*/15 * * * *"]

# Same KV namespace the Pages app binds as env.coin (see HANDOFF.md /
# soitbegins-local launch config) — this worker reads/writes the exact
# same pswap:numbermap:v1 / pswap:highsale:v4 keys the site reads from.
[[kv_namespaces]]
binding = "coin"
id = "9169a9a4d1ae42bd9c020a4077bc643c"
